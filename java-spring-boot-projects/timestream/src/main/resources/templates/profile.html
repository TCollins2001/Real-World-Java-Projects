<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>PROFILE | TIMESTREAM</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="profile-body" style="background: none;">
<nav>
    <a href="/index">HOME</a>
    <a th:href="${session.loggedInUser == null ? '/sign-up' : '/profile'}">PROFILE</a>
    <a th:href="${session.loggedInUser == null ? '/sign-up' : '/all-chats'}">CHAT</a>
    <a href="/about">ABOUT</a>
    <a href="/contact">CONTACT</a>
    <a th:if="${session.loggedInUser == null}" href="/sign-up" class="login-link">SIGN-UP/LOGIN</a>
    <span th:if="${session.loggedInUser != null}" class="welcome-user">
  Welcome,<strong th:text="${session.loggedInUser.username}"></strong>!
    <a href="/logout" class="logout-link" style="color: #042844;">LOG OUT</a>
</span>
</nav>
<a href="/index">
    <img src="images/logo.png" alt="website logo" class="logo">
</a>
<div class="profile-header">
    <div class="cover-container">
        <img th:if="${session.loggedInUser != null}"
             th:src="${session.loggedInUser.coverPic ?: '/images/doctor-who-bg.jpg'}"
             class="profile-cover" />
        <img class="editing-pencil" src="images/editing-pencil.png" id="editProfileCover">
        <img class="editing-reset cover-reset" src="images/reset-icon.png" id="resetCoverPic">
    </div>
    <div class="avatar-container">
        <img th:if="${session.loggedInUser != null}"
             th:src="${session.loggedInUser.profilePic ?: '/images/no-profile-pic.png'}"
             class="profile-pic" />
        <div class="avatar-overlay"></div>
        <img class="editing-pencil avatar-pencil" src="images/editing-pencil.png" id="editProfilePic">
        <img class="editing-reset avatar-reset" src="images/reset-icon.png" id="resetProfilePic">
</div>
    <div class="user-personal-info">
 <span th:if="${session.loggedInUser != null}" class="user-profile-name">
  <strong th:text="${session.loggedInUser.username}"></strong>
</span>
        <div class="open-chat-count">
            <strong>
                Open Chats
            </strong>
            <a href="/all-chats"><span th:text="${openChats}">0</span></a>
        </div>
    </div>
    <div class="member-since-info">
        <input type="hidden" id="createdAt"
               th:value="${session.loggedInUser.createdAt}">
        <strong>
            You've Been Traveling Through Your Timeline For
            <span id="months"></span> Months,
            <span id="days"></span> Days,
            <span id="seconds"></span> Seconds
            (<span th:text="${#temporals.format(session.loggedInUser.createdAt, 'MMMM dd, yyyy')}"></span>)
        </strong>
    </div>
</div>
<div class="profile-form-container">
    <form action="/upload-profile-pic" method="post" enctype="multipart/form-data" id="profileForm" style="display: none;">
        <input id="profileUpload" type="file" name="profile_pic" accept="image/*">
    </form>
    <form action="/upload-cover-pic" method="post" enctype="multipart/form-data" id="coverForm" style="display: none;">
        <input id="coverUpload" type="file" name="cover_pic" accept="image/*">
    </form>
</div>
<div class="regen-select">
    <label for="regen">Choose Your Doctor - </label>
    <select id="regen">
        <option value=""></option>
        <option value="9">Ninth Doctor Aesthetic</option>
        <option value="10">Tenth Doctor Aesthetic</option>
        <option value="11">Eleventh Doctor Aesthetic</option>
        <option value="12">Twelfth Doctor Aesthetic</option>
        <option value="13">Thirteenth Doctor Aesthetic</option>
        <option value="14">Fourteenth Doctor Aesthetic</option>
        <option value="15">Fifteenth Doctor Aesthetic</option>
    </select>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById("editProfilePic").addEventListener("click", () => {
        document.getElementById("profileUpload").click();
    });

    document.getElementById("profileUpload").addEventListener("change", () => {
        document.getElementById("profileForm").submit();
    });

    document.getElementById("editProfileCover").addEventListener("click", () => {
        document.getElementById("coverUpload").click();
    });

    document.getElementById("coverUpload").addEventListener("change", () => {
        document.getElementById("coverForm").submit();
    });

    document.getElementById("resetProfilePic")
    .addEventListener("click", () => {
        fetch("/reset-profile-pic", { method: "POST" })
            .then(() => {
                const profileImg = document.querySelector('.profile-pic');
                profileImg.src = '/images/no-profile-pic.png?' + new Date().getTime();
            })
            .catch(error => console.error('Error:', error));
    });

    document.getElementById("resetCoverPic")
    .addEventListener("click", () => {
        fetch("/reset-cover-pic", { method: "POST" })
            .then(() => {
                const coverImg = document.querySelector('.profile-cover');
                coverImg.src = '/images/doctor-who-bg.jpg?' + new Date().getTime();
            })
            .catch(error => console.error('Error:', error));
    });
</script>
<script>
    function updateTimeline() {
        const createdAt = new Date(document.getElementById("createdAt").value);
        const now = new Date();

        let diffMs = now - createdAt;

        let diffSec = Math.floor(diffMs / 1000);

        let diffDays = Math.floor(diffSec / 86400);
        let diffMonths = Math.floor(diffDays / 30);
        diffDays = diffDays % 30;

        document.getElementById("months").textContent = diffMonths;
        document.getElementById("days").textContent = diffDays;
        document.getElementById("seconds").textContent = diffSec.toLocaleString();
    }
    updateTimeline();
    setInterval(updateTimeline, 1000);
</script>
<script>
    const REGENS = {
    9: {
        glow: "#1A1A1A",
        ui: "#1A1A1A",
        text: "white",
        borderR: "#ffffff"
    },
    10: {
        glow: "#4DB8FF",
        ui: "#4DB8FF",
        borderR: "#ffffff"
    },
    11: {
        glow: "#66FF66",
        ui: "#66FF66",
        borderR: "#ffffff"
    },
    12: {
        glow: "#B3001B",
        ui: "#B3001B",
        borderR: "#ffffff"
    },
     13: {
        glow: "#F4D03F",
        ui: "#F4D03F",
        borderR: "#ffffff"
    },
     14: {
        glow: "#C08A4A",
        ui: "#C08A4A",
        borderR: "#ffffff"
    },
     15: {
        glow: "#FF6B00",
        ui: "#FF6B00",
        borderR: "#ffffff"
    }
    };

    document.getElementById("regen").addEventListener("change", function() {
    const regen = this.value;
    applyRegenTheme(regen);
});

function applyRegenTheme(regen) {
    const theme = REGENS[regen];
    if (!theme) return;

    const avatar = document.querySelector(".avatar-container");
    avatar.style.setProperty("--regen-color", theme.glow);
    avatar.classList.add("regen-animated");

    document.body.style.setProperty("--bg-regeneration", theme.glow);

    document.documentElement.style.setProperty("--regen-text", theme.text);

    document.documentElement.style.setProperty("--border-regeneration", theme.borderR);

    document.documentElement.style.setProperty("--ui-bg", theme.ui);
    document.documentElement.style.setProperty("--ui-border", theme.glow);
    }
</script>
</body>
</html>
