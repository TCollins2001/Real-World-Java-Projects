<script>
    document.getElementById("editProfilePic").addEventListener("click", () => {

    });

    document.getElementById("profileUpload").addEventListener("change", () => {
        document.getElementById("profileForm").submit();
    });

    document.getElementById("editProfileCover").addEventListener("click", () => {
        document.getElementById("coverUpload").click();
    });

    document.getElementById("coverUpload").addEventListener("change", () => {
        document.getElementById("coverForm").submit();
    });

    document.getElementById("resetProfilePic")
    .addEventListener("click", () => {
        fetch("/reset-profile-pic", { method: "POST" })
            .then(() => {
                const profileImg = document.querySelector('.profile-pic');
                profileImg.src = '/images/no-profile-pic.png?' + new Date().getTime();
            })
            .catch(error => console.error('Error:', error));
    });

    document.getElementById("resetCoverPic")
    .addEventListener("click", () => {
        fetch("/reset-cover-pic", { method: "POST" })
            .then(() => {
                const coverImg = document.querySelector('.profile-cover');
                coverImg.src = '/images/doctor-who-bg.jpg?' + new Date().getTime();
            })
            .catch(error => console.error('Error:', error));
    });

document.querySelectorAll(".field").forEach(field => {
  const input = field.querySelector(".edit-input");
  const editBtn = field.querySelector(".personal-edit-btn");
  const saveBtn = field.querySelector(".personal-save-btn");

  if (!input || !editBtn || !saveBtn) return;

  editBtn.addEventListener("click", () => {
    input.readOnly = false;
    input.classList.remove("readonly");
    input.classList.add("editing");

    editBtn.classList.add("hidden");
    saveBtn.classList.remove("hidden");

    input.focus();
    input.select();
  });

  saveBtn.addEventListener("click", async () => {
    const fieldName = input.dataset.field;
    const value = input.value.trim();

    if (!fieldName) return;

    saveBtn.disabled = true;
    saveBtn.textContent = "Saving…";

    try {
      await fetch("/profile/update", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ field: fieldName, value })
      });

      input.readOnly = true;
      input.classList.remove("editing");
      input.classList.add("readonly");

      saveBtn.classList.add("hidden");
      editBtn.classList.remove("hidden");
    } catch (err) {
      console.error("Save failed", err);
      alert("Failed to save changes.");
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = "💾 Save";
    }
  });
});
const modal = document.getElementById("passwordModal");

document.getElementById("changePasswordBtn").onclick = () => {
  modal.classList.remove("hidden");
};

document.getElementById("cancelPasswordBtn").onclick = () => {
  modal.classList.add("hidden");
};

document.getElementById("savePasswordBtn").onclick = async () => {
  const currentPassword = document.getElementById("currentPassword").value;
  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (!currentPassword || !newPassword || !confirmPassword) {
    alert("All fields required");
    return;
  }

  if (newPassword !== confirmPassword) {
    alert("Passwords do not match");
    return;
  }

  const res = await fetch("/profile/change-password", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ currentPassword, newPassword })
  });

  if (res.ok) {
    alert("Password updated");
    modal.classList.add("hidden");

    document.getElementById("currentPassword").value = "";
    document.getElementById("newPassword").value = "";
    document.getElementById("confirmPassword").value = "";
  } else {
    alert("Current password incorrect");
  }
};
</script>
<script>
    function updateTimeline() {
        const createdAt = new Date(document.getElementById("createdAt").value);
        const now = new Date();

        let diffMs = now - createdAt;

        let diffSec = Math.floor(diffMs / 1000);

        let diffDays = Math.floor(diffSec / 86400);
        let diffMonths = Math.floor(diffDays / 30);
        diffDays = diffDays % 30;

        document.getElementById("months").textContent = diffMonths;
        document.getElementById("days").textContent = diffDays;
        document.getElementById("seconds").textContent = diffSec.toLocaleString();
    }
    updateTimeline();
    setInterval(updateTimeline, 1000);
</script>

function showDoctorAppearance(doctorId) {
  const container = document.getElementById("doctor-appearance");
  const img = document.getElementById("doctor-image");

  if (!doctorId || doctorId === "Default") {
  img.src = "";
  container.classList.add("hidden");
  return;
  }

  img.src = `/images/doctors/${doctorId}-pop.png`;
  container.classList.remove("hidden");
  container.classList.add("show");
}

  document.getElementById("regen").addEventListener("change", async function () {
  const doctorId = this.value;
  if (!doctorId) return;

  applyRegenTheme(doctorId);
  showDoctorAppearance(doctorId);

  await fetch("/profile/update-theme", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ theme: doctorId })
  });
});

document.addEventListener("DOMContentLoaded", () => {
  const savedDoctor = document.body.dataset.doctor;

  if (!savedDoctor || savedDoctor === "Default") return;

  applyRegenTheme(savedDoctor);
  showDoctorAppearance(savedDoctor);
});


function applyRegenTheme(regen) {
  const theme = REGENS[regen] || REGENS.Default;

  const avatar = document.querySelector(".avatar-container");
  avatar.style.setProperty("--regen-color", theme.glow);
  avatar.classList.add("regen-animated");

  document.documentElement.style.setProperty("--regen-text", theme.text);
  document.documentElement.style.setProperty("--border-regeneration", theme.borderR);
  document.documentElement.style.setProperty("--ui-border", theme.glow);
  document.documentElement.style.setProperty("--regen-accent", theme.glow);

  if (theme.bgPattern) {
    document.body.style.setProperty("--bg-pattern", theme.bgPattern);
    document.body.style.setProperty("--bg-base", theme.bgBase || "#000");
    document.body.style.setProperty("--bg-overlay", "none");
  } else {
    document.body.style.setProperty(
      "--bg-pattern",
      'url("images/doctor-who-bg.jpg")'
    );
    document.body.style.setProperty("--bg-base", "#000");
    document.body.style.removeProperty("--bg-overlay");
  }
}

            const deleteBtn = document.querySelector(".delete-account-btn");

            deleteBtn.addEventListener("click", async () => {
              const confirmed = confirm(
                "This will permanently delete your account.\n\nThis action cannot be undone.\n\nAre you sure?"
              );

              if (!confirmed) return;

              try {
                const res = await fetch("/profile/delete-account", {
                  method: "DELETE"
                });

                if (res.ok) {
                  alert("Your account has been deleted.");
                  window.location.href = "/sign-up";
                } else {
                  alert("Failed to delete account.");
                }
              } catch (err) {
                console.error(err);
                alert("Something went wrong.");
              }
            });
        </script>
