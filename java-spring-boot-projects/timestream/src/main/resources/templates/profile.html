<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>PROFILE | TIMESTREAM</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="profile-body" style="background: none;">
<nav>
    <a href="/index">HOME</a>
    <a href="/profile">PROFILE</a>
    <a href="/all-chats">CHAT</a>
    <a href="/about">ABOUT</a>
    <a href="/contact">CONTACT</a>
    <a th:if="${session.loggedInUser == null}" href="/sign-up" class="login-link">SIGN-UP/LOGIN</a>
    <span th:if="${session.loggedInUser != null}" class="welcome-user">
  Welcome,<strong th:text="${session.loggedInUser.username}"></strong>!
    <a href="/logout" class="logout-link">LOG OUT</a>
</span>
</nav>
<a href="/index">
    <img src="images/logo.png" alt="website logo" class="logo">
</a>
<div class="profile-header">
    <div class="cover-container">
        <img th:if="${session.loggedInUser != null}"
             th:src="${session.loggedInUser.coverPic ?: '/images/doctor-who-bg.jpg'}"
             class="profile-cover" />
        <img class="editing-pencil" src="images/editing-pencil.png" id="editProfileCover">
        <img class="editing-reset cover-reset" src="images/reset-icon.png" id="resetCoverPic">
    </div>
    <div class="avatar-container">
        <img th:if="${session.loggedInUser != null}"
             th:src="${session.loggedInUser.profilePic ?: '/images/no-profile-pic.png'}"
             class="profile-pic" />
        <div class="avatar-overlay"></div>
        <img class="editing-pencil avatar-pencil" src="images/editing-pencil.png" id="editProfilePic">
        <img class="editing-reset avatar-reset" src="images/reset-icon.png" id="resetProfilePic">
</div>
</div>
<div class="profile-form-container">
    <form action="/upload-profile-pic" method="post" enctype="multipart/form-data" id="profileForm" style="display: none;">
        <input id="profileUpload" type="file" name="profile_pic" accept="image/*">
    </form>

    <form action="/upload-cover-pic" method="post" enctype="multipart/form-data" id="coverForm" style="display: none;">
        <input id="coverUpload" type="file" name="cover_pic" accept="image/*">
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById("editProfilePic").addEventListener("click", () => {
        document.getElementById("profileUpload").click();
    });

    document.getElementById("profileUpload").addEventListener("change", () => {
        document.getElementById("profileForm").submit();
    });

    document.getElementById("editProfileCover").addEventListener("click", () => {
        document.getElementById("coverUpload").click();
    });

    document.getElementById("coverUpload").addEventListener("change", () => {
        document.getElementById("coverForm").submit();
    });

    document.getElementById("resetProfilePic")
    .addEventListener("click", () => {
        fetch("/reset-profile-pic", { method: "POST" })
            .then(() => {
                const profileImg = document.querySelector('.profile-pic');
                profileImg.src = '/images/no-profile-pic.png?' + new Date().getTime();
            })
            .catch(error => console.error('Error:', error));
    });

    document.getElementById("resetCoverPic")
    .addEventListener("click", () => {
        fetch("/reset-cover-pic", { method: "POST" })
            .then(() => {
                const coverImg = document.querySelector('.profile-cover');
                coverImg.src = '/images/doctor-who-bg.jpg?' + new Date().getTime();
            })
            .catch(error => console.error('Error:', error));
    });
</script>
</body>
</html>
