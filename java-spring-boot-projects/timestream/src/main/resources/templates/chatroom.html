<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>CHATROOM | TIMESTREAM</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="chat-body" style="background: url('images/chat-bg.jpg'); background-size: cover;">
<div class="transition-div">
<nav>
    <a href="/index">HOME</a>
    <a th:href="${session.loggedInUser == null ? '/sign-up' : '/profile'}">PROFILE</a>
    <a th:href="${session.loggedInUser == null ? '/sign-up' : '/all-chats'}">CHAT</a>
    <a href="/about">ABOUT</a>
    <a href="/contact">CONTACT</a>
    <a th:if="${session.loggedInUser == null}" href="/sign-up" class="login-link">SIGN-UP/LOGIN</a>
    <span th:if="${session.loggedInUser != null}" class="welcome-user">
  Welcome,<strong th:text="${session.loggedInUser.username}"></strong>!
    <a href="/logout" class="logout-link" style="color: #042844;">LOG OUT</a>
</span>
</nav>
<a href="/index">
    <img src="images/logo.png" alt="website logo" class="logo">
</a>
<div class="chatroom-container">
<div class="chatroom-window">
    <div class="chat-left">
        <input type="hidden" id="usernameField"
               th:if="${session.loggedInUser != null}"
               th:value="${session.loggedInUser.username}">
        <input type="hidden" id="sessionIdField"
               th:value="${sessionId}">
        <div class="chat-messages" id="messages"></div>
    </div>
    <div class="chatroom-side-panel">
    <div class="participants-panel">
        <h3>Chat Participants</h3>
        <ul id="participantsList"></ul>
    </div>
        <div class="chat-preview-panel">
            <h3>All Chats</h3>
            <div id="chatPreviewList" class="chat-preview-list"></div>
        </div>
        <button id="leaveChatBtn" class="leave-chat-btn">
            Leave Chat
        </button>
    </div>
</div>
    <div id="leaveModal" class="delete-modal hidden">
        <div class="delete-modal-content">
            <h2>Leave Chat?</h2>
            <p>
                You are about to leave this timeline. You won't see new messages unless you are invited back.
            </p>
            <div class="delete-actions">
                <button id="stayBtn">Stay</button>
                <button id="leaveBtn">Leave</button>
            </div>
        </div>
    </div>
<input type="text" id="messageInput" placeholder="Type Your Message Here..." style="border: 3px solid black;">
<button type="submit" id="send-btn">SEND</button>
</div>
<script src="/chat.js"></script>
</div>
</body>
</html>
