<div id="chatPreviewContainer" class="chat-preview-container"></div>
    <script th:inline="javascript">
        window.CURRENT_USER = /*[[${session.loggedInUser.username}]]*/ "";
    </script>
    <script th:inline="javascript">
    let pendingDeleteChatId = null;
   window.addEventListener("DOMContentLoaded", () => {


   window.addOrUpdateChatPreview = function (id, displayNames, customRoomName) {
   const box = document.getElementById("chatPreviewContainer");
   let preview = document.querySelector(`.chat-preview[data-id="${id}"]`);

   if (!preview) {
   preview = document.createElement("div");
   preview.classList.add("chat-preview");
   preview.dataset.id = id;
   box.appendChild(preview);
   }

   preview.innerHTML = `
   <div class="participant-corner">${displayNames}</div>
   <img src="images/tardis.png" class="chat-tardis" style="width: 60px; height: 60px;">
   <div class="chat-display-name">
        ${customRoomName || displayNames}
    </div>
   `;
   preview.onclick = () => {
    window.location.href = `/chatroom?sessionId=${id}`;
  };

   const deleteBtn = document.createElement("button");
   deleteBtn.classList.add("delete-chat-btn");
   deleteBtn.textContent = "X";
   deleteBtn.style = "font-weight: bold; color: red; border-color: white; background: white; cursor: pointer;";

   deleteBtn.addEventListener("click", (e) => {
   e.preventDefault();
   e.stopPropagation();

     pendingDeleteChatId = id;
     document.getElementById("deleteModal").classList.remove("hidden");
   });

   preview.appendChild(deleteBtn);
   }

       const chats = /*[[${chats}]]*/ [];
       const currentUser = /*[[${session.loggedInUser.username}]]*/ "";

       chats.forEach(chat => {
   const participants = Array.isArray(chat.participants) ? chat.participants : [];

   if (participants.length <= 1) return;

   const displayNames = participants
     .filter(u => u && u !== currentUser)
     .join(" • ");

     addOrUpdateChatPreview(chat.id, displayNames, chat.customRoomName);

   });

   async function refreshChatPreviews() {
 try {
   const res = await fetch("/chat-previews");
   const chats = await res.json();

   const container = document.getElementById("chatPreviewContainer");
    const currentChatIds = chats.map(c => c.id.toString());

    document.querySelectorAll('.chat-preview').forEach(el => {
      if (!currentChatIds.includes(el.dataset.id)) {
        el.remove();
      }
    });

   const currentUser = /*[[${session.loggedInUser.username}]]*/ "";

   chats.forEach(chat => {
     const participants = Array.isArray(chat.participants)
       ? chat.participants
       : [];

     if (participants.length <= 1) return;

     const displayNames = participants
       .filter(u => u && u !== currentUser)
       .join(" • ");

     addOrUpdateChatPreview(chat.id, displayNames, chat.customRoomName);
   });

 } catch (err) {
   console.error("Failed to refresh chat previews:", err);
 }
}
   refreshChatPreviews();
   setInterval(refreshChatPreviews, 3000);

   });

const deleteModal = document.getElementById("deleteModal");
const cancelDeleteBtn = document.getElementById("cancelDeleteBtn");
const deleteDeleteBtn = document.getElementById("deleteDeleteBtn");

cancelDeleteBtn.addEventListener("click", () => {
 pendingDeleteChatId = null;
 deleteModal.classList.add("hidden");
});

deleteDeleteBtn.addEventListener("click", () => {
 if (!pendingDeleteChatId) return;

 deleteChat(pendingDeleteChatId);
 pendingDeleteChatId = null;
 deleteModal.classList.add("hidden");
});

deleteModal.addEventListener("click", (e) => {
 if (e.target === deleteModal) {
   pendingDeleteChatId = null;
   deleteModal.classList.add("hidden");
 }
});

const inviteSentModal = document.getElementById("inviteSentModal");

inviteSentModal.addEventListener("click", (e) => {
  if (e.target === inviteSentModal) {
    inviteSentModal.classList.add("hidden");
  }
});

function deleteChat(id) {
   fetch(`/delete-chat-session/${id}`, {
       method: "POST"
   }).then(() => {
       document.querySelector(`[data-id="${id}"]`)?.remove();
   });
   }

</script>
<script src="/search.js"></script>
<script src="/invite.js"></script>
<script src="/hamburger.js"></script>
