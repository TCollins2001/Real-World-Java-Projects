<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>ALL CHATS | TIMESTREAM</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="all-chat-body" style="background: none; background: linear-gradient(135deg, #001133, #002966); padding-bottom: 100px;">
<nav>
    <a href="/index">HOME</a>
    <a th:href="${session.loggedInUser == null ? '/sign-up' : '/profile'}">PROFILE</a>
    <a th:href="${session.loggedInUser == null ? '/sign-up' : '/all-chats'}">CHAT</a>
    <a href="/about">ABOUT</a>
    <a href="/contact">CONTACT</a>
    <a th:if="${session.loggedInUser == null}" href="/sign-up" class="login-link">SIGN-UP/LOGIN</a>
    <span th:if="${session.loggedInUser != null}" class="welcome-user">
  Welcome,<strong th:text="${session.loggedInUser.username}"></strong>!
    <a href="/logout" class="logout-link" style="color: #042844;">LOG OUT</a>
</span>
</nav>
<a href="/index">
  <img src="images/logo.png" alt="website logo" class="logo">
</a>
<div class="mail-container" style="display: flex; justify-content: center; align-items: center;" id="inviteEnvelope">
    <img src="/images/envelope.png" style="width: 200px; height: 150px; position: relative; top: 200px; background-color: white; border-radius: 10px;" class="envelope-icon">
    <span id="inviteBadge" class="invite-badge hidden"></span>
</div>
<div id="inviteModal" class="invite-modal hidden">
    <div class="invite-modal-content">
    <h2>Chat Invites</h2>
        <div id="inviteList"></div>
        <button id="closeInviteBtn">×</button>
    </div>
</div>
<div class="chat-box">
        <div class="search-container">
            <input type="text"  id="userSearch" autocomplete="off" placeholder="Invite a companion...">
        </div>
    <div id="searchResults" class="search-results" style="background-color: white; margin: 20px auto; width: 53%;"></div>
</div>
<div id="chatPreviewContainer" class="chat-preview-container"></div>
<script th:inline="javascript">
    window.addEventListener("DOMContentLoaded", () => {
        const chats = /*[[${chats}]]*/ [];
        const currentUser = /*[[${session.loggedInUser.username}]]*/ "";

        chats.forEach(chat => {
    const otherUser =
        chat.userA === currentUser ? chat.userB : chat.userA;

    addChatPreview(chat.id, otherUser);
    });
    });

    window.addChatPreview = function (id, username) {
    if (document.querySelector(`.chat-preview[data-id="${id}"]`)) return;

    const box = document.getElementById("chatPreviewContainer");

    const preview = document.createElement("div");
    preview.classList.add("chat-preview");
    preview.dataset.id = id;

      if (username) {
      preview.innerHTML = `<span style="font-weight:bold;color:#062a64;text-transform:uppercase;font-family: 'Russo One', sans-serif;">You & ${username}</span>`;
      }

    const inner = document.createElement("div");
    inner.classList.add("chat-preview-inner");
    inner.innerHTML = `<img src="images/tardis.png" class="chat-tardis" style="width: 60px; height: 60px;">`;

    const deleteBtn = document.createElement("button");
    deleteBtn.classList.add("delete-chat-btn");
    deleteBtn.textContent = "X";
    deleteBtn.style = "font-weight: bold; color: red; border-color: white; background: white; cursor: pointer;";

    deleteBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();

        const ok = confirm("Are you sure you want to delete this chat?");
        if (!ok) return;

        deleteChat(id);
    });

    preview.addEventListener("click", () => {
        window.location.href = `/chatroom?sessionId=${id}`;
    });

    preview.appendChild(inner);
    preview.appendChild(deleteBtn);
    box.appendChild(preview);
}

function deleteChat(id) {
    fetch(`/delete-chat-session/${id}`, {
        method: "POST"
    }).then(() => {
        document.querySelector(`[data-id="${id}"]`)?.remove();
    });
    }

</script>
<script src="/search.js"></script>
<script src="/invite.js"></script>
</body>
</html>
