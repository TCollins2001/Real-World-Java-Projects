<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>ALL CHATS | TIMESTREAM</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="all-chat-body" style="background: none; background: linear-gradient(135deg, #001133, #002966); padding-bottom: 100px;">
<div class="transition-div">
<nav>
    <a href="/index">HOME</a>
    <a th:href="${session.loggedInUser == null ? '/sign-up' : '/profile'}">PROFILE</a>
    <a th:href="${session.loggedInUser == null ? '/sign-up' : '/all-chats'}">CHAT</a>
    <a href="/about">ABOUT</a>
    <a href="/contact">CONTACT</a>
    <a th:if="${session.loggedInUser == null}" href="/sign-up" class="login-link">SIGN-UP/LOGIN</a>
    <span th:if="${session.loggedInUser != null}" class="welcome-user">
  Welcome,<strong th:text="${session.loggedInUser.username}"></strong>!
    <a href="/logout" class="logout-link" style="color: #042844;">LOG OUT</a>
</span>
</nav>
<a href="/index">
  <img src="images/logo.png" alt="website logo" class="logo">
</a>
<div class="mail-container" style="display: flex; justify-content: center; align-items: center;" id="inviteEnvelope">
    <img src="/images/envelope.png" style="background-color: white; border-radius: 10px;" class="envelope-icon">
    <span id="inviteBadge" class="invite-badge hidden">0</span>
</div>
<div id="inviteModal" class="invite-modal hidden">
    <div class="invite-modal-content">
    <h2>Chat Invites</h2>
        <div id="inviteList"></div>
        <button id="closeInviteBtn">×</button>
    </div>
</div>
<div class="chat-box">
    <input type="hidden" id="activeChatId" value="">
        <div class="invite-bar">
            <div id="chipInput" class="chip-input">
            <input type="text"  id="userSearch" autocomplete="off" placeholder="Invite companions...">
                <button id="inviteBtn" class="invite-btn">Invite</button>
        </div>
        </div>
    <div id="searchResults" class="search-results" style="background-color: white; margin: 20px auto; width: 53%;"></div>
</div>
<div id="chatPreviewContainer" class="chat-preview-container"></div>
<script th:inline="javascript">
    window.addEventListener("DOMContentLoaded", () => {

    window.addOrUpdateChatPreview = function (id, displayNames) {
    const box = document.getElementById("chatPreviewContainer");
    let preview = document.querySelector(`.chat-preview[data-id="${id}"]`);

    if (!preview) {
    preview = document.createElement("div");
    preview.classList.add("chat-preview");
    preview.dataset.id = id;

    preview.innerHTML = `<img src="images/tardis.png" class="chat-tardis" style="width: 60px; height: 60px;">
    <div class="chat-names" style="
      font-weight: bold;
      color: #ffffff;
      text-transform: uppercase;
      font-family: 'Russo One', sans-serif;
    ">
    </div>`;

    const deleteBtn = document.createElement("button");
    deleteBtn.classList.add("delete-chat-btn");
    deleteBtn.textContent = "X";
    deleteBtn.style = "font-weight: bold; color: red; border-color: white; background: white; cursor: pointer;";

    deleteBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (!confirm("Are you sure you want to delete this chat?")) return;
    deleteChat(id);
    });

    preview.addEventListener("click", () => {
        window.location.href = `/chatroom?sessionId=${id}`;
    });

    preview.appendChild(deleteBtn);
    box.appendChild(preview);
}

    preview.querySelector(".chat-names").textContent =
    displayNames || "YOU";

    }

        const chats = /*[[${chats}]]*/ [];
        const currentUser = /*[[${session.loggedInUser.username}]]*/ "";

        chats.forEach(chat => {
    const participants = Array.isArray(chat.participants) ? chat.participants : [];

    if (participants.length <= 1) return;

    const displayNames = participants
      .filter(u => u && u !== currentUser)
      .join(" • ");

      addOrUpdateChatPreview(chat.id, displayNames);

    });

    async function refreshChatPreviews() {
  try {
    const res = await fetch("/chat-previews");
    const chats = await res.json();

    const currentUser = /*[[${session.loggedInUser.username}]]*/ "";

    chats.forEach(chat => {
      const participants = Array.isArray(chat.participants)
        ? chat.participants
        : [];

      if (participants.length <= 1) return;

      const displayNames = participants
        .filter(u => u && u !== currentUser)
        .join(" • ");

      addOrUpdateChatPreview(chat.id, displayNames);
    });

  } catch (err) {
    console.error("Failed to refresh chat previews:", err);
  }
}
    refreshChatPreviews();
    setInterval(refreshChatPreviews, 3000);

    });

function deleteChat(id) {
    fetch(`/delete-chat-session/${id}`, {
        method: "POST"
    }).then(() => {
        document.querySelector(`[data-id="${id}"]`)?.remove();
    });
    }

</script>
<script src="/search.js"></script>
<script src="/invite.js"></script>
</div>
</body>
</html>
