<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PocketATM | View</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="menu-body">
<h1>POCKETATM</h1>

<div class="modal fade" id="depositModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Deposit Funds</h5>
            </div>
            <div class="modal-body text-center">
    <h2>YOUR BALANCE: </h2>
    <br>
    <br>
    <div class="balance-border">
    <p class="dollar">$<span th:text="${userBalance}">0.00</span></p>
        <a href="/menu"><button type="button" class="back">BACK</button></a>
    </div>
</div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    let showModal = /*[[${showDepositModal}]]*/ false;
    if (showModal) {
        let modal = new bootstrap.Modal(document.getElementById('depositModal'));
        modal.show();
    }
    /*]]>*/
</script>
</body>
</html>
