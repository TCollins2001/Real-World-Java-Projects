<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Study Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f6f7fb; }
    .card { background: white; border-radius: 12px; padding: 20px; max-width: 900px; margin: 0 auto; box-shadow: 0 6px 18px rgba(0,0,0,.08); }
    h1 { margin: 0 0 6px; }
    .muted { color: #666; margin-top: 0; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    input, button, select { padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; }
    input, select { flex: 1; min-width: 160px; }
    button { cursor: pointer; border: none; background: #1f6feb; color: white; padding: 10px 14px; }
    .summary { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .pill { background: #eef2ff; padding: 10px 12px; border-radius: 999px; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; margin-top: 18px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
    th { color: #444; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
    .right { text-align: right; }
    .danger { background: #e11d48; }
  </style>
</head>
<body>
<div class="card">
  <h1>Study Session Tracker</h1>
  <p class="muted">Log sessions. Track totals. Build streaks.</p>

  <h3>Add Session</h3>
  <form action="/add-session" method="post" class="row">
    <input type="text" name="topic" placeholder="Topic (e.g., Spring Boot)" required>
    <input type="number" name="minutes" placeholder="Minutes" min="1" required>
    <input type="date" name="date" required>
    <button type="submit">Add</button>
  </form>

  <div class="summary">
    <div class="pill" th:text="'Total Minutes: ' + ${totalMinutes}"></div>
    <div class="pill" th:text="'Sessions: ' + ${sessionCount}"></div>
  </div>

  <h3 style="margin-top: 22px;">Recent Sessions</h3>
  <table>
    <thead>
    <tr>
      <th>Date</th>
      <th>Topic</th>
      <th class="right">Minutes</th>
      <th class="right">Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="sess : ${sessions}">
      <td th:text="${sess.date}"></td>
      <td th:text="${sess.topic}"></td>
      <td class="right" th:text="${sess.minutes}"></td>
      <td class="right">
        <form action="/delete-session" method="post" style="display:inline;">
          <input type="hidden" name="id" th:value="${sess.id}">
          <button type="submit" class="danger">Delete</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
