<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expense Tracker | Expenses </title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f6f7fb; }
    .card { background: white; border-radius: 10px; padding: 20px; max-width: 800px; margin: 0 auto; box-shadow: 0 6px 18px rgba(0,0,0,.08); }
    h1 { margin: 0 0 10px; }
    .muted { color: #666; margin-top: 0; }

    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
    input, select, button {
      padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px;
    }
    input { flex: 1; min-width: 140px; }
    select { min-width: 160px; }
    button { cursor: pointer; border: none; background: #1f6feb; color: white; padding: 10px 14px; }

    .summary { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
    .pill { background: #eef2ff; padding: 10px 12px; border-radius: 999px; font-weight: 600; }

    table { width: 100%; border-collapse: collapse; margin-top: 18px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
    th { color: #444; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
    td.amount { font-weight: 700; }
    .right { text-align: right; }
  </style>
</head>
<body>

<div class="card">
  <h1>Expense Tracker</h1>
  <p class="muted">Add an expense, then view totals and recent activity.</p>

  <!-- Add Expense Form (would post to Spring controller) -->
  <h3>Add Expense</h3>
  <form action="/add-expense" method="post" class="row">
    <input type="text" name="itemDesc" placeholder="Description (e.g., Groceries)" required>
    <input type="number" step="0.01" name="itemAmount" placeholder="Amount" required>
    <button type="submit">Add</button>
  </form>

  <!-- Summary -->
  <div class="summary">
    <div class="pill" th:text="'Total This Month: $' + ${#numbers.formatDecimal(total,1,2)}"></div>
    <div th:each="expense : ${expenses}"
         class="pill"
         th:text="${expense.itemDesc + ': $' + #numbers.formatDecimal(expense.itemAmount,1,2)}">
    </div>
  </div>

  <!-- Recent Expenses -->
  <h3 style="margin-top: 22px;">Recent Expenses</h3>
  <table>
    <thead>
    <tr>
      <th>Description</th>
      <th class="right">Amount</th>
      <th class="right">Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="expense : ${expenses}">
      <td th:text="${expense.itemDesc}"></td>
      <td class="amount right"
          th:text="${#numbers.formatDecimal(expense.itemAmount, 1, 2)}">
      </td>
      <td class="right">
        <form action="/delete-expense" method="post" style="display:inline;">
          <input type="hidden" name="id" th:value="${expense.id}">
          <button type="submit" style="background:#e11d48;">Delete</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
