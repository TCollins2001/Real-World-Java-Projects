<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>ACCOUNTS | T.C BANK</title>
    <link rel="stylesheet" href="/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="dashboard-container">
<h3>DASHBOARD</h3>
    <div id="accounts-section">
    <h4>Accounts</h4>
    <div class="accounts-container">
        <div class="outward-container">
        <p>Savings</p>
        <div class="inner-container">
            <span class="account-name">YOUR SAVINGS</span>
            <span class="deposit-btn">DEPOSIT</span>
            <span class="withdraw-btn">WITHDRAW</span>
            <span class="account-balance">$0.00</span>
        </div>
        </div>
        <div class="outward-container">
        <p>Checking</p>
        <div class="inner-container">
            <span class="account-name">YOUR CHECKING</span>
            <button type="button" class="deposit-btn" onclick="showDeposit('CHECKING')">DEPOSIT</button>
            <span class="withdraw-btn">WITHDRAW</span>
            <span th:text="'$' + ${#numbers.formatDecimal(checking.balance, 1, 2)}" class="account-balance"></span>
        </div>
    </div>
    </div>
</div>
<div id="deposit-section" class="hidden">
    <div class="deposit-container">
        <form action="/deposit-funds" method="post">
            <input type="hidden" id="accountTypeInput" name="accountType">
            <input type="number" name="amount" required>
            <button type="submit" class="deposit-sub-btn">DEPOSIT</button>

            <button onclick="goBack()">Cancel</button>
        </form>
</div>
</div>
</div>
<script>
    function showDeposit(type) {

        document.getElementById("accountTypeInput").value = type;

        document.getElementById("accounts-section").classList.add("hidden");
        document.getElementById("deposit-section").classList.remove("hidden");
    }

    function goBack() {
        document.getElementById("deposit-section").classList.add("hidden");
        document.getElementById("accounts-section").classList.remove("hidden");
    }
</script>
</body>
</html>
