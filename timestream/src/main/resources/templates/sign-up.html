<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SIGN UP | TIMESTREAM</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="sign-up-div">
<form action="" method="post">
    <div class="form-container">
    <div class="sign-up-wrapper">
        <div class="main-form active">
        <h1>SIGN UP</h1>
        <label for="first-name">First Name</label>
        <input type="text" name="first-name" id="first-name" placeholder="Enter First Name" required>
        <label for="last-name">Last Name</label>
        <input type="text" name="last-name" id="last-name" placeholder="Enter Last Name" required>

        <label for="email">Email</label>
        <input type="text" name="email" id="email" placeholder="Enter Email" required>
        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="Enter Password" required>

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Re-Enter Password" required>
        <button type="button" class="next-btn">NEXT</button>
        </div>

        <div class="username-form">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" placeholder="Enter Username" required>
            <div class="button-row">
                <button type="button" class="back-btn">BACK</button>
            <button type="submit" class="submit-btn">SUBMIT</button>
            </div>
        </div>
    </div>
    </div>
</form>
    <div class="right-side">
        <h2>HELLO, SWEETIE...</h2>
        <h1>WELCOME TO THE TIMESTREAM!</h1>
        <p>PRESS SIGN UP TO JUMP INTO YOUR TIME STREAM.</p>
    </div>
</div>
<script>
    const nextBtn = document.querySelector('.next-btn');
const backBtn = document.querySelector('.back-btn');
const mainForm = document.querySelector('.main-form');
const usernameForm = document.querySelector('.username-form');

nextBtn.addEventListener('click', () => {
  mainForm.classList.add('hidden');        // hide step 1
  usernameForm.classList.add('active');    // show step 2
});

backBtn.addEventListener('click', () => {
  usernameForm.classList.remove('active'); // go back
  mainForm.classList.remove('hidden');
});
</script>

</body>
</html>
